# Local Postgres for development: `docker compose up -d`, then `npm run db:push`.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: xurri
      POSTGRES_PASSWORD: xurri
      POSTGRES_DB: xurri
    ports:
      - '5432:5432'
    volumes:
      - xurri-db:/var/lib/postgresql/data

volumes:
  xurri-db:
